[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "entity-linker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.2",
    "gliner>=0.2.29",
    "httpx>=0.28.1",
    "nervaluate>=1.2.1",
    "protobuf>=7.36.2",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "ranx>=0.3.21",
    "sentencepiece>=0.2.2",
    "torch>=2.14.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# PyTorch (dependencia de GLiNER) en su versión solo CPU: la de PyPI incluye
# varios GB de librerías CUDA que el servicio no usa
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
